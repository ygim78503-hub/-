<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>민승이 </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- =====================
  홈 화면
===================== -->
<section id="home" class="page active">
  <h1>민승이</h1>
  <p> 무료로 7일 사용해보기</p>
  <!-- 로그인 버튼 누르면 바로 대시보드로 이동 -->
  <button onclick="showPage('dashboard')">로그인</button>
  <button class="secondary" onclick="showPage('signupPage')">회원가입</button>
</section>

<!-- =====================
  로그인 (혹시 이 페이지로 올 경우를 대비해 여기도 바로 이동 처리)
===================== -->
<section id="loginPage" class="page">
  <h2>로그인</h2>
  <input type="email" placeholder="이메일" />
  <input type="password" placeholder="비밀번호" />
  <button onclick="showPage('dashboard')">로그인</button>
</section>

<!-- =====================
  회원가입
===================== -->
<section id="signupPage" class="page">
  <h2>회원가입</h2>
  <input type="email" placeholder="이메일" />
  <input type="password" placeholder="비밀번호" />
  <button onclick="showPage('dashboard')">회원가입</button>
</section>

<!-- =====================
  대시보드
===================== -->
<section id="dashboard" class="page">

  <header>
    <button id="menuBtn" onclick="toggleSidebar()">☰</button>
    <div class="service-name">자동응답 시스템</div>
  </header>

  <nav id="sidebar">
    <ul>
      <li>개인정보</li>
      <li>설정</li>
      <li onclick="showPage('home')">로그아웃</li>
      <li onclick="closeSidebar()">닫기</li>
    </ul>
  </nav>

  <main>
    <h2>환영합니다 👋</h2>
    <p>민승이를 설정해보세요</p>

    <div class="card">
      <h3>자동화</h3>
      <p> 응답합니다.</p>
      <button onclick="showPage('qnaPage')">민승이 등록하기</button>
    </div>

    <footer>
      <button class="social-btn">YouTube</button>
      <button class="social-btn">Instagram</button>
      <button class="social-btn">앱 설치</button>
    </footer>
  </main>
</section>

<!-- =====================
  질문 · 응답 등록
===================== -->
<section id="qnaPage" class="page">
  <div class="qna-container">

    <div class="qna-header">
      <button onclick="showPage('dashboard')">←</button>
      <span>민승이</span>
    </div>

    <div class="qna-content">
      <input placeholder="예: 언제 도착하나요?" />
      <textarea placeholder="자동으로 보낼 답변을 입력하세요"></textarea>

      <div class="usage-select">
        <button>웹사이트</button>
        <button>앱</button>
      </div>

      <select>
        <option>앱 선택</option>
        <option>인스타그램</option>
        <option>카카오톡</option>
        <option>문자</option>
        <option>WhatsApp</option>
        <option>디스코드</option>
      </select>

      <button>저장하기</button>
    </div>

  </div>
</section>

<!-- 페이지 전환용 스크립트 추가 -->
<script>
  function showPage(pageId) {
    // 모든 페이지에서 active 클래스 제거
    document.querySelectorAll('.page').forEach(page => {
      page.classList.remove('active');
    });
    // 선택한 페이지만 active 추가
    document.getElementById(pageId).classList.add('active');
  }
</script>

<!-- 기존 script.js의 사이드바 기능 등을 유지하기 위해 남겨둠 -->
<script type="module" src="script.js"></script>

</body>
</html>
